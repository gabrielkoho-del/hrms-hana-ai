  employee_leave_hd:
    # Complex create with header-detail pattern
    strategy: leave_action
    entity_type: header
    required_fields:
      - "employee_no"
      - "status"

  employee_leave:
    # Complex create with header_id chaining
    strategy: leave_action
    entity_type: detail
    header_entity: "employee_leave_hd"
    required_fields:
      - "hd_id"
      - "employee_no"
      - "leave_code"
      - "date_from"
      - "date_to"
      - "days"
      - "status"
      - "emergency"
      - "period_type_from"
      - "period_type_to"

  employee_leave_entitlement:
    # Read + update for entitlement adjustments
    strategy: entitlement_update
    filter_fields:
      - "employee_no"
      - "leave_code"
      - "year"
    updatable_fields:
      - "adjustment"
      - "remarks"
