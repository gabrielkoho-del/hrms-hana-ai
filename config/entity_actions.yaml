# =============================================================================
# Entity action configurations
# Unified registry for entity-specific action patterns.
# Each entry defines how to handle update/create actions for an entity.
#
# Adding a new entity:
# 1. Add entity config to this file
# 2. If strategy exists (simple_update, leave_action), no new code needed
# 3. If new strategy needed, create strategies/new_strategy.py
# 4. Register in agent/actions/__init__.py _STRATEGY_REGISTRY
# =============================================================================
entity_actions:
  employee_general:
    # Simple self-update: read by employee_no, then update specific fields.
    # Primary key is {company_code, employee_no} - we read first to get company_code.
    strategy: simple_update
    filter_field: "employee_no"
    key_fields:
      - "company_code"
      - "employee_no"
    # Fields that employees can update on their own record
    self_updateable_fields:
      - "mobile_no"
      - "personal_email"
      - "mail_address"
      - "contact_no"
      - "emergency_name"
      - "emergency_contact_no"
      - "emergency_relation"
      - "emergency_email"
      - "emergency_name2"
      - "emergency_contact_no2"
      - "emergency_relation2"
      - "emergency_email2"
      - "emergency_address"
      - "emergency_address2"
      - "nickname"
      - "personal_title"
      - "name_ext"
      - "home_mail_address"
      - "home_google_geo_lat"
      - "home_google_geo_lang"
      - "passport_no"
