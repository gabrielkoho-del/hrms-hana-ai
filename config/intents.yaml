# ── Regex Patterns ──────────────────────────────────────────────────────────
# Stored as raw strings; compiled at load time in intent_classifier.py
full_info_patterns:
  - "\\b(pull|get|show|give|fetch|send)\\s+(me\\s+)?(my\\s+)?(full|complete|all|entire)\\s+(the\\s+)?(info|information|details|record|records|data|profile)\\b"
  - "\\b(my\\s+full|my\\s+complete|all\\s+my|full\\s+profile|complete\\s+profile)\\b"
  - "\\b(full|complete|all)\\s+the\\s+(record|records|info|information|details)\\b"
  - "\\b(full|complete|all)\\s+(record|records|info|information|details)\\b"
  - "\\b(everything|raw\\s+data|all\\s+fields|all\\s+columns)\\s+(on\\s+file|in\\s+your\\s+system|you\\s+have)\\b"
