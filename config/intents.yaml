# config/intents.yaml
# Single source of truth for intent classification.
# Loaded by agent/core/intent_classifier.py and agent/core/intent_config.py
version: 1

# ── Categories ──────────────────────────────────────────────────────────────
categories:
  personal_data:
    label: "Personal Data"
    description: "Individual employee data lookups (never chart)"
    chart_eligible: false
    data_scope: individual
    urgency_default: routine
  aggregate_data:
    label: "Aggregate Data"
    description: "Aggregate HR metrics, distributions, trends (chart eligible)"
    chart_eligible: true
    data_scope: aggregate
    urgency_default: routine
  policy_info:
    label: "Policy Information"
    description: "Policy questions and how-to guidance (no data)"
    chart_eligible: false
    data_scope: none
    urgency_default: routine
  action_request:
    label: "Action Request"
    description: "User wants to take an action (submit, apply, update)"
    chart_eligible: false
    data_scope: individual
    urgency_default: routine
  emergency:
    label: "Emergency"
    description: "Urgent personal emergencies"
    chart_eligible: false
    data_scope: individual
    urgency_default: distressed
  grievance:
    label: "Grievance"
    description: "Complaints and grievances"
    chart_eligible: false
    data_scope: individual
    urgency_default: urgent
  greeting:
    label: "Greeting"
    description: "Greetings and small talk"
    chart_eligible: false
    data_scope: none
    urgency_default: routine
  data_discovery:
    label: "Data Discovery"
    description: "Questions about what data/systems are available"
    chart_eligible: false
    data_scope: none
    urgency_default: routine
  workforce_analytics:
    label: "Workforce Analytics"
    description: "Workforce productivity metrics (chart eligible)"
    chart_eligible: true
    data_scope: aggregate
    urgency_default: routine
  dashboard_building:
    label: "Dashboard Building"
    description: "Dashboard creation and visualization building"
    chart_eligible: true
    data_scope: aggregate
    urgency_default: routine

# ── Intents ─────────────────────────────────────────────────────────────────
intents:
  greeting:
    category: greeting
    description: "User says hello or similar"
    exemplars:
      - "hello"
      - "hi there"
      - "good morning"
      - "hey"
      - "hi"
  smalltalk:
    category: greeting
    description: "Casual conversation"
    exemplars:
      - "how are you"
      - "what's up"
      - "nice to meet you"
      - "how's it going"
  leave_request:
    category: action_request
    description: "User wants to request leave"
    exemplars:
      - "I need to apply for leave"
      - "Request vacation for next week"
      - "Can I take sick leave tomorrow"
      - "Apply for annual leave"
      - "I'd like to request time off"
  leave_balance:
