# config/intents_eval.yaml
# Intent classification evaluation dataset and CI gating thresholds.
# Loaded by agent/core/eval_intent_classifier.py
version: 1
description: "Intent classification eval dataset for CI gating"

thresholds:
  min_per_intent_precision: 0.85
  min_per_intent_recall: 0.85
  min_overall_f1: 0.90
  max_regression_delta: 0.05  # fail if any metric drops >5% from baseline

